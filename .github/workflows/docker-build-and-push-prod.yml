name: docker-build-and-push-prod-ci

# Releases are cut by release-please: merging its release PR on main creates
# the vX.Y.Z tag, and that tag push builds and publishes the images
on:
  push:
    tags:
      - 'v*'

# The default GITHUB_TOKEN on new repos is read-only - packages:write is
# needed to (create and) push the GHCR package
permissions:
  contents: read
  packages: write

jobs:
  docker-build-companion-image:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            jammsen/palworld-companion
            ghcr.io/${{ github.repository }}
          # v1.2.3 tag -> image tags 1.2.3 and latest
          tags: |
            type=semver,pattern={{version}}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Typecheck, unit tests and the bundle build all run inside the image
      # build stage - a broken test fails the build before anything is pushed
      - name: Build and push the images
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

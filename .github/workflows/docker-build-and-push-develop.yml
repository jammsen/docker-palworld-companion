name: docker-build-and-push-develop-ci

on:
  push:
    branches:
      - develop

# The default GITHUB_TOKEN on new repos is read-only - packages:write is
# needed to (create and) push the GHCR package
permissions:
  contents: read
  packages: write

jobs:
  docker-build-companion-image:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            jammsen/palworld-companion
            ghcr.io/${{ github.repository }}

      # Typecheck, unit tests and the bundle build all run inside the image
      # build stage - a broken test fails the build before anything is pushed
      - name: Build the images
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -e PANEL_ENABLED=true -e PANEL_PASSWORD=smoke-test "jammsen/palworld-companion:develop"
          sleep 5
          docker exec smoke node -e "fetch('http://127.0.0.1:8213/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
          docker rm -f smoke

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the images
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
